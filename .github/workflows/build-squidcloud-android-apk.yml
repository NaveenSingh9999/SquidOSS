name: Build SquidCloud Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "scripts/generate-android-icons.sh"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-squidcloud-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      SQUIDCLOUD_STORE_PASSWORD: "fuckyouHACKER@1234"
      SQUIDCLOUD_KEY_ALIAS: "squidcloud"
      SQUIDCLOUD_KEY_PASSWORD: "fuckyouHACKER@1234"
      SQUIDCLOUD_KEYSTORE_BASE64: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm i

      - name: Restore SquidCloud keystore from env
        run: |
          set -euo pipefail
          if [ -z "$SQUIDCLOUD_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required env var: SQUIDCLOUD_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android
          # Remove any accidental whitespace/newlines from pasted base64 and decode safely.
          printf '%s' "$SQUIDCLOUD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/squidcloud.keystore
          if [ ! -s android/squidcloud.keystore ]; then
            echo "::error::Decoded keystore file is empty"
            exit 1
          fi
          echo "SQUIDCLOUD_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/squidcloud.keystore" >> "$GITHUB_ENV"

      - name: Build Android APK using Local Script
        run: |
          sudo bash scripts/build-android-local.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: squidcloud-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Push APK to SquidCloud Dev API
        run: |
          curl -X POST "https://aouqcwbdoyrccjcrhzzi.supabase.co/functions/v1/cloudbliss-api/files/upload" \
            -H "X-SquidCloud-Key: $SQUIDCLOUD_API_KEY" \
            -F "file=@android/app/build/outputs/apk/release/app-release.apk"
        env:
          SQUIDCLOUD_API_KEY: "cb_61cade50fdd599e2b4995fdafa9f72fa1b3ea575fe52fd41540fd175e6ec6519"

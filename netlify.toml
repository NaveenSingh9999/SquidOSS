
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure proper MIME types for assets
[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "*.json"
  [headers.values]
    Content-Type = "application/json"

# Disable caching for index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Cache control for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31557600, immutable"
    
# Block access to source maps and source files
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'"
    
# Security headers for all paths - Updated CSP to allow external fonts and scripts
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.gpteng.co; style-src 'self' 'unsafe-inline' https://rsms.me https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://rsms.me; img-src 'self' data: blob: https:; connect-src 'self' https: data: *..live; object-src 'none'; media-src 'self' blob: data:; worker-src 'self' blob:;"
    Cache-Control = "public, max-age=31557600, immutable"

# Specific redirect for shared files to handle client-side routing
[[redirects]]
  from = "/share/*"
  to = "/index.html"
  status = 200

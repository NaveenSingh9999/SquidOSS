
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SquidCloud - Secure, Unlimited Cloud Storage for Your Digital Life with end-to-end encryption" />
    <meta name="keywords" content="cloud storage, secure storage, encrypted files, file sharing, unlimited storage" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://squidcloud.app/" />
    <meta property="og:title" content="SquidCloud - Secure, Unlimited Cloud Storage" />
    <meta property="og:description" content="Experience the future of secure storage with end-to-end encryption, unlimited space, and AI-powered organization." />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://squidcloud.app/" />
    <meta property="twitter:title" content="SquidCloud - Secure, Unlimited Cloud Storage" />
    <meta property="twitter:description" content="Experience the future of secure storage with end-to-end encryption, unlimited space, and AI-powered organization." />
    <meta property="twitter:image" content="/og-image.jpg" />
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    
    <title>SquidCloud - Secure, Unlimited Cloud Storage</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(registration) {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            }, function(err) {
              console.log('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>

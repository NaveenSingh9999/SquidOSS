<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <rect width="1200" height="675" fill="#0C0A15"/>
  <circle cx="200" cy="100" r="400" fill="#4C1D95" opacity="0.3" filter="blur(100px)"/>
  <circle cx="1000" cy="600" r="500" fill="#059669" opacity="0.15" filter="blur(120px)"/>
  <circle cx="600" cy="300" r="400" fill="#2563EB" opacity="0.1" filter="blur(150px)"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(80, 60)">
    <!-- Browser Border/Glass -->
    <rect width="1040" height="600" rx="16" fill="#111827" fill-opacity="0.6" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Traffic Lights -->
    <circle cx="30" cy="24" r="6" fill="#EF4444"/>
    <circle cx="50" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="70" cy="24" r="6" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="250" y="14" width="540" height="20" rx="10" fill="#1F2937" fill-opacity="0.8"/>
    <text x="520" y="27" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">squidcloud.inflate.live / dashboard</text>

    <!-- Divider -->
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#374151" stroke-width="1"/>

    <!-- Sidebar -->
    <rect x="0" y="48" width="220" height="552" fill="#111827" fill-opacity="0.5" rx="0" clip-path="url(#sidebar-clip)"/>
    
    <!-- Sidebar Items -->
    <text x="24" y="90" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">🦑 SquidCloud</text>
    
    <rect x="16" y="120" width="188" height="36" rx="8" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.3"/>
    <rect x="28" y="132" width="12" height="12" rx="2" fill="#60A5FA"/>
    <text x="50" y="143" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Home</text>
    
    <rect x="28" y="176" width="12" height="12" rx="2" fill="#9CA3AF"/>
    <text x="50" y="187" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="14">Files &amp; Folders</text>
    
    <rect x="28" y="220" width="12" height="12" rx="2" fill="#9CA3AF"/>
    <text x="50" y="231" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="14">SquidVault 🔒</text>

    <rect x="28" y="264" width="12" height="12" rx="2" fill="#9CA3AF"/>
    <text x="50" y="275" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="14">cbCode IDE</text>

    <rect x="28" y="308" width="12" height="12" rx="2" fill="#9CA3AF"/>
    <text x="50" y="319" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="14">Shared with Me</text>

    <line x1="16" y1="350" x2="204" y2="350" stroke="#374151" stroke-width="1"/>

    <text x="24" y="380" fill="#6B7280" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">RES54 NETWORK</text>
    <rect x="20" y="400" width="180" height="6" rx="3" fill="#374151"/>
    <rect x="20" y="400" width="130" height="6" rx="3" fill="#10B981"/>
    <text x="24" y="426" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">Infinite Quota Active</text>
    <text x="140" y="426" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Online</text>

    <!-- Main Content Area -->
    <g transform="translate(250, 80)">
      
      <!-- Header -->
      <text x="0" y="20" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">Dashboard</text>
      <rect x="670" y="-4" width="100" height="32" rx="16" fill="#4C1D95"/>
      <text x="720" y="16" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">+ Upload File</text>

      <!-- Stats Row -->
      <rect x="0" y="50" width="240" height="100" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <circle cx="30" cy="80" r="16" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="60" y="85" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">Items Stored</text>
      <text x="20" y="125" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">1,248</text>
      <text x="180" y="123" fill="#10B981" font-family="system-ui, sans-serif" font-size="12">+12%</text>

      <rect x="265" y="50" width="240" height="100" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <circle cx="295" cy="80" r="16" fill="#10B981" fill-opacity="0.2"/>
      <text x="325" y="85" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">Network Speed</text>
      <text x="285" y="125" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">428</text>
      <text x="345" y="123" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="16">MB/s</text>
      
      <rect x="530" y="50" width="240" height="100" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <circle cx="560" cy="80" r="16" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="590" y="85" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="13">Active Chunks (Res54)</text>
      <text x="550" y="125" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">24,591</text>

      <!-- Res54 Graph / Chart Area -->
      <rect x="0" y="180" width="505" height="280" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <text x="20" y="210" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Global Chunk Distribution</text>
      
      <!-- Graph Lines Mockup -->
      <path d="M 20 420 Q 80 400 120 350 T 250 320 T 350 280 T 480 250" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
      <path d="M 20 420 Q 80 400 120 350 T 250 320 T 350 280 T 480 250" fill="none" stroke="#8B5CF6" stroke-width="8" stroke-opacity="0.3"/>
      
      <path d="M 20 440 Q 100 420 180 400 T 300 410 T 400 370 T 480 340" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
      <path d="M 20 440 Q 100 420 180 400 T 300 410 T 400 370 T 480 340" fill="none" stroke="#10B981" stroke-width="8" stroke-opacity="0.3"/>
      
      <!-- Grid Lines -->
      <line x1="20" y1="250" x2="485" y2="250" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="20" y1="310" x2="485" y2="310" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="20" y1="370" x2="485" y2="370" stroke="#374151" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="20" y1="430" x2="485" y2="430" stroke="#374151" stroke-width="1"/>

      <!-- Recent Files Column -->
      <rect x="530" y="180" width="240" height="280" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <text x="550" y="210" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Recent Files</text>

      <!-- File 1 -->
      <rect x="545" y="235" width="32" height="32" rx="6" fill="#F43F5E" fill-opacity="0.2"/>
      <text x="550" y="255" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">PDF</text>
      <text x="590" y="248" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13">Q3_Financials.pdf</text>
      <text x="590" y="263" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">2 mins ago • 3.2 MB</text>

      <!-- File 2 -->
      <rect x="545" y="285" width="32" height="32" rx="6" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="551" y="305" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">DOC</text>
      <text x="590" y="298" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13">API_Spec_v11.docx</text>
      <text x="590" y="313" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">1 hr ago • 1.1 MB</text>

      <!-- File 3 -->
      <rect x="545" y="335" width="32" height="32" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="553" y="355" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ZIP</text>
      <text x="590" y="348" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13">Assets_Bundle.zip</text>
      <text x="590" y="363" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="11">4 hrs ago • 142 MB</text>
      
      <!-- File 4 -->
      <rect x="545" y="385" width="32" height="32" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="552" y="405" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CSV</text>
      <text x="590" y="398" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="13">User_Data.csv</text>
      <text x="590" y="413" fill="#10B981" font-family="system-ui, sans-serif" font-size="11">Encrypted • 18 MB</text>
      <rect x="740" y="391" width="16" height="16" rx="4" fill="#10B981"/>
      <text x="744" y="403" fill="#064E3B" font-family="system-ui, sans-serif" font-size="10">E2E</text>

    </g>

    <!-- Clip Path for Sidebar -->
    <defs>
      <clipPath id="sidebar-clip">
        <path d="M0 48 H220 V600 Q220 600 220 600 H16 Q0 600 0 584 V48 Z"/>
      </clipPath>
    </defs>
  </g>
</svg>